<!--
  ============================================================================
  LUVIT · سكشن 4 من ١٣ · تشويق الكويز
  ============================================================================
  مولّد من library/home-preview.html · لا تعدّل هون، عدّل بالمعاينة وأعد التوليد.

  كيف بينركّب:
  1. Elementor ← اسحب ويدجت HTML جوّا كونتينر لحاله
  2. الصق كل اللي تحت
  3. اختار الكونتينر (مش الويدجت) ← Advanced ← Attributes، واكتب:
       data-nav-bg|dark
     ⚠ الفاصل خط عامودي | مش يساوي =
  CSS ID  : quiz       ← Advanced ← CSS ID
  4. Update، وبعدها LiteSpeed ← Purge All، وافحص بنافذة تصفّح خفي

  ⚠ زر «كمّلي الاختبار» href="#" · بده صفحة الكويز

  ⚠ هذا السكشن فيه موجة فوق وموجة تحت، والاثنتان جزء منه.
     الموجة اللي فوق بترتفع فوق كونتينر الروتينات لحالها بالـCSS، فلا تحط
     ولا padding علوي على الكونتينر وإلا بيبين شق أبيض بينها وبين السكشن.
  ============================================================================
-->

<!--
  ============================================================================
  الحافة العليا · موجة، بلا عنصر موجة
  ============================================================================
  جرّبنا موجة منفصلة فوق هذا السكشن وفشلت، والسبب مبدئي مش ضبط:

  الموجة المنفصلة بترسم لون واحد سادة. وسطح هذا السكشن مش لون واحد، هو تدرّج
  عمودي + توهّجين ضوئيين بيتحركوا + حقل فقاعات. فمهما ظبّطنا اللون، بيضل خط
  فاصل مكان ما بينتهي الشريط وبتبدأ السطح الحقيقي، والفقاعات بتنقسم نصّين عليه.

  الحل: كلاس luvit-cut-top بيخلي السكشن نفسه يقص حافته العليا بالموجة. كل شي
  بيرسمه السكشن بينقص بنفس المنحنى لأنه كله عنصر واحد، فما في إشي تاني يطابقه.

  فلا تضيف <div class="luvit-wave"> فوق هذا السكشن · بترجع نفس المشكلة.
  ============================================================================
-->
<section class="luvit-section luvit-section--dark luvit-deep luvit-cut-top" data-nav-bg="dark"
         data-luvit-bubbles="10" id="quiz">
  <span class="luvit-deep__rays" aria-hidden="true"></span>
  <div class="luvit-section__inner">
    <div class="luvit-quiz luvit-quiz--on-dark" data-luvit="reveal">
      <h2 class="luvit-quiz__q">شو أكثر إشي بيزعجك ببشرتك؟</h2>

      <div class="luvit-optiongrid">
        <label class="luvit-option">
          <input type="radio" name="home-quiz" value="dry">
          <span class="luvit-option__icon" aria-hidden="true">💧</span>
          <span class="luvit-option__label">جفاف وشدّ</span>
        </label>
        <label class="luvit-option">
          <input type="radio" name="home-quiz" value="oil">
          <span class="luvit-option__icon" aria-hidden="true">✦</span>
          <span class="luvit-option__label">لمعة ودهون</span>
        </label>
        <label class="luvit-option">
          <input type="radio" name="home-quiz" value="acne">
          <span class="luvit-option__icon" aria-hidden="true">◇</span>
          <span class="luvit-option__label">حبوب</span>
        </label>
        <label class="luvit-option">
          <input type="radio" name="home-quiz" value="calm">
          <span class="luvit-option__icon" aria-hidden="true">✿</span>
          <span class="luvit-option__label">احمرار وحساسية</span>
        </label>
      </div>

      <div class="luvit-quiz__foot">
        <a href="/quiz" class="luvit-btn luvit-btn--arrow">كمّلي الاختبار</a>
        <p class="luvit-quiz__hint">أقل من دقيقة · ٥ أسئلة بس.</p>
      </div>
    </div>
  </div>
</section>

<div class="luvit-wave luvit-wave--drift" style="--wave-fill:#FFFFFF;background:#0B9198" aria-hidden="true"></div>
