<!-- ══════════════════════════════════════════════════════════════════════
     إشعار الكوكيز · سنيبت WPCode من نوع HTML · الفوتر · أولوية ٢٠
     ══════════════════════════════════════════════════════════════════════
     🔴 طلبه ريّان ٢ أيلول: «بشكل حلو ومش مزعج أبداً · ما بدي إياه ياكل
        نص الصفحة أو أكثر».
     ⤷ فهو **شريط رفيع بأسفل الصفحة**، بلا طبقة سوداء ورا، وبلا ما يمنع
       القراءة ولا الضغط. ارتفاعه ≈٧٢px بالديسكتوب.

     ── 🔴 انتغيّر ٣ أيلول · من **خيار** لـ**إخبار** ─────────────────────
     كان فيه زرّان: «بس الضروري» و«موافقة على الكل»، والأول كان بيمسح
     كوكيز التتبّع.

     وريّان ٣ أيلول: «عدل وخليها **الزاميه** التحليلات هاي كثير بتهمني»
     · وقبلها ١ أيلول: «جوجل أناليتكس وكلاريتي · هاي أهم إشي».

     ⤷ فلو ضلّ زرّ «بس الضروري» موجود، بيصير الموقع **بيعرض قراراً ما
       بينفّذه**: الزبونة بتضغطه وبتفتكر إنها وقّفت التتبّع وهو شغّال.
       وهاد مش تفصيلاً تنظيمياً · هاد **الكذب**، وهو خطّ ريّان الأحمر
       المكتوب بدستور المشروع.

     🔴 **فالقاعدة اللي انبنى عليها هالملف من جديد: ما منعرض خياراً
        إحنا مش رح نحترمه.** سطر بيوصف اللي بيصير، ورابط للتفاصيل،
        وزرّ إقرار. ولا وعد كاذب.

     ✅ وصفحة الخصوصية مطابقة أصلاً · مكتوب فيها من ١ أيلول «بنستعمل
        أدوات تحليلات … مجهّلة» و«ما بتنباع ولا بتنعطى لوسيط إعلاني».
        فما بدها تعديل، وانفحصت قبل هالتغيير لا بعده.

     ── ⚠️ ولما ينضاف بكسل إعلانات (ميتا مثلاً) ─────────────────────────
     وقتها **بيرجع الخيار** · بس للبكسل وحده لا للتحليلات، ولازم يكون
     خياراً حقيقياً بينفّذ فعلاً. الواجهة تحت جاهزة إلها.

     ── الواجهة لأي سكربت جاي ──────────────────────────────────────────
       window.luvitConsent            → 'all' (ثابتة حالياً · التحليلات إلزامية)
       document.addEventListener('luvit:consent', e => e.detail)
     ══════════════════════════════════════════════════════════════════ -->

<div class="luvit-consent" id="luvit-consent" hidden
     role="region" aria-label="إشعار الكوكيز">
  <p class="luvit-consent__text">
    منستعمل كوكيز عشان الموقع يشتغل، ومنقيس كيف بتنستعمل الصفحات ·
    <a href="/privacy/">شو منجمع بالضبط</a>.
  </p>
  <div class="luvit-consent__acts">
    <button type="button" class="luvit-btn" data-consent="ack">تمام</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'luvit-consent';
  var box = document.getElementById('luvit-consent');
  if (!box) return;

  /* 🔴 دالة المسح `forget()` **انشالت** مع الخيار.
     كانت بتمسح `sbjs_*` و`_ga*` و`_clck` لو اختارت «بس الضروري» ·
     وما عاد في «بس الضروري». كود بينفّذ قراراً ما عاد موجود بيقرا
     كأنه حماية وهو ميت. */

  function apply(v, announce) {
    /* 🔴 القيمة المعلَنة لأي سكربت جاي بتضل 'all' · لأنّ اللي بيصير
       فعلاً هو التتبّع الكامل. لو رجّعنا 'ack' بيصير عندنا حالة تالتة
       ما حدا بيعرف يقرأها، ولو رجّعنا 'essential' بنكون كذبنا على
       الكود كمان لا على الزبونة بس. */
    window.luvitConsent = 'all';
    document.cookie = KEY + '=' + v + '; Max-Age=31536000; path=/; SameSite=Lax';
    if (announce) {
      document.dispatchEvent(new CustomEvent('luvit:consent', { detail: 'all' }));
    }
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (!saved) {
    var m = document.cookie.match(/(?:^|;\s*)luvit-consent=([^;]+)/);
    if (m) saved = m[1];
  }

  /* ⚠️ `essential` و`all` قيم قديمة من نسخة الخيار · بتنقبل كإقرار
     عشان اللي قرّر قبل ما يشوف الشريط من جديد بلا سبب. */
  if (saved === 'ack' || saved === 'all' || saved === 'essential') {
    apply(saved, false);
    return;
  }

  /* ⚠️ ما بيبيّن إلا بعد ثانية · عشان ما يزاحم المحتوى ولا يقفز بوجه
     القارئة أول ما تفتح.
     🔴 وبلا `requestAnimationFrame` بقصد · هي **ما بتشتغل بتبويب مش
        بالواجهة**، فالشريط كان بيضل مخفي بأي تبويب مفتوح بالخلفية
        (انكشفت بالفحص الآلي ٢ أيلول · القراءة قالت hidden وهي سليمة
        بالماركب والستايل). `setTimeout` بتشتغل بكل الحالات. */
  setTimeout(function () {
    box.hidden = false;
    /* فريم واحد بين الإظهار وبين الكلاس · عشان الانتقال يبدأ من مكانه */
    setTimeout(function () { box.classList.add('is-in'); }, 30);
  }, 900);

  box.addEventListener('click', function (e) {
    var b = e.target.closest('[data-consent]');
    if (!b) return;
    var v = b.getAttribute('data-consent');
    try { localStorage.setItem(KEY, v); } catch (err) {}
    apply(v, true);
    box.classList.remove('is-in');
    setTimeout(function () { box.hidden = true; }, 260);
  });
})();
</script>
