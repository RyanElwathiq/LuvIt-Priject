  ٢ · وسطر الكويز وزر «اكتشفي روتينك» ما بينزلوا قبل ما تكون صفحة /quiz
      موجودة · نفس البوابة اللي على سكشن ٨.

  🔴 انشال رقم «أربع أسئلة» من سطر الكويز.
     الرقم ما إله مصدر، وبيناقض اللي منشور فعلاً: 04-quiz.html سطر 73

     ⤷ لما تنبني الصفحة: ثبّت العدد الحقيقي، وحدّث 04-quiz.html وسكشن ٨

  🔴 وانغيّر «مش متأكدة من نوعها؟» لـ«مش متأكدة من نوع بشرتك؟».

       a.luvit-option { text-decoration: none; color: var(--color-ink); }
       a.luvit-option .luvit-option__icon { color: var(--aqua-500); }

       a.luvit-option:hover::after { transform: translateY(0); }
       a.luvit-option:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--color-ring); }

        :has(input:checked) و:has(input:focus-visible)، وما في input
        بنسخة الرابط · يعني ما في حلقة تركيز للكيبورد. هاي مشكلة وصول،
