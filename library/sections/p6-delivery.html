  🔴🔴🔴 قفل ١ · بند «أيام العمل» ممنوع ينزل بقيمة · GATED
  ---------------------------------------------------------------------------
  البند الثالث بينزل بعنوانه وقيمته **فاضية عن قصد**. شركة التوصيل لسا ما ردّت.

  ممنوع تكتب أي يوم، ولا أي جدول، ولا «من الأحد للخميس»، ولا أي قاعدة عن يوم
  الجمعة، قبل ما **ريّان** يأكّد بالنص أيام العمل الفعلية وقاعدة الجمعة.
  السؤال اللي لازم ينسأل حرفياً:
     «أيام التوصيل عندنا شو بالضبط، ومنيّن لوين، وهل فيه توصيل يوم الجمعة؟»

  🔴 إذا الصفحة رح تنزل قبل التأكيد: **احذف البند الثالث كامل**، ولا تعبّيه
     بتخمين ولا بنص عام.
  🔴 وإذا انحذف: «ثلاث أشياء» بالسطر التمهيدي لازم تصير «إشيين».
  🔴 والقيمة الفاضية بتخلّي البطاقة الثالثة أقصر شوي من أخواتها · هاد مقصود
     ومقبول، مش باغ تصميم يتصلّح بنص وهمي.

  ---------------------------------------------------------------------------

  والرقم اللي بالزون حالياً placeholder كمان · صاحب الموقع بيسلّم الرقم الحقيقي.
