<!-- ⚠️ `luvit-section--dark` إلزامية مع `luvit-deep` · هي اللي بتقلب
     العنوان والسطر والـeyebrow لأبيض. `luvit-deep` بتعمل الخلفية وبس،
     فبلاها بيطلع نصّ غامق على ماء غامق. -->
<section class="luvit-section luvit-section--dark luvit-deep luvit-page-top" data-nav-bg="dark"
         data-luvit-bubbles="12" id="page-head">
  <span class="luvit-deep__rays" aria-hidden="true"></span>
  <div class="luvit-section__inner">
    <div class="luvit-section__head" data-luvit="reveal">

      <nav aria-label="مسار التنقّل">
        <a href="/">الرئيسية</a>
        <span aria-hidden="true">›</span>
        <span aria-current="page">المقالات</span>
      </nav>

      <h1 class="luvit-section__title">مقالات عن بشرتك</h1>
      <p class="luvit-section__sub">
        شرح بسيط للمكوّنات والخطوات · بلا مصطلحات وبلا وعود.
      </p>

    </div>
  </div>
</section>

<!-- 🔴 الفيل = لون الشرائح تحتها (band-light) · والخلفية = آخر لون
     بتدرّج .luvit-deep بالضبط (#0B9198) -->
<div class="luvit-wave" style="--wave-fill:#FFFFFF;background:#0B9198" aria-hidden="true"></div>
